<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockPilot — Offline</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #059669; color: #fff; margin: 0; padding: 2rem; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; }
    .card { background: #fff; color: #1a1a1a; padding: 2rem; border-radius: 1rem; max-width: 28rem; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
    .icon { font-size: 3rem; }
    h1 { font-size: 1.5rem; margin: 1rem 0 0.5rem; }
    p { color: #6b7280; font-size: 0.95rem; }
    button { background: #059669; color: #fff; border: 0; padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-size: 0.95rem; margin-top: 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>You're offline</h1>
    <p>StockPilot works fully offline — your sales and inventory continue to work. Cloud sync will resume when you reconnect.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
